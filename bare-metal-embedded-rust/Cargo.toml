[package]
version = "0.1.0"
name = "embedded-rust"
edition = "2024"

[dependencies]
cortex-m = "0.7.2"
cortex-m-rt = "0.7"
embedded-hal = "1.0.0"
log = "0.4.32"
rp2040-boot2 = "0.3.0"
rp2040-hal = { version = "0.12.0", features = ["rt", "critical-section-impl"]}
usb-device = "0.3.2"
usbd-serial = "0.2.2"

[[bin]]
name = "embedded-rust"
path = "src/main.rs"
harness = false
